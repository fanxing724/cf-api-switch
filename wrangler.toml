name = "cf-api-switch"
main = "src/index.js"
compatibility_date = "2025-06-01"

# ---------------------------------------------------------------------------
# ⚠ 部署前必做：下面这个 id 是占位值，本地 `wrangler dev` 能跑，
#   但 `wrangler deploy` 会报找不到 namespace。请先执行：
#
#     npx wrangler kv namespace create cf_api_switch
#
#   把输出的 id 替换掉下面这行，再部署。预览环境可另建一个填进 preview_id。
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "0123456789abcdef0123456789abcdef"
# preview_id = "可选，预览环境用的 namespace id"

[observability]
enabled = true

[vars]
# ---------------------------------------------------------------------------
# 无 KV 时的兜底渠道配置（JSON 数组）。配了 KV 之后以 KV 里的为准，
# 面板上的增删改会写回 KV，不会改这个变量。
# ---------------------------------------------------------------------------
CHANNELS = '[]'

# 站点设置兜底：管理员密码哈希 / 客户端 Key。
# 正常走面板设置，这里只作为无 KV 环境下的预置。
SETTINGS = '{"requireAuth": false, "clientKeys": []}'

# 上游默认超时（毫秒），渠道里可单独覆盖
UPSTREAM_TIMEOUT_MS = "120000"

# 允许跨域的来源，"*" 表示全部
CORS_ALLOW_ORIGIN = "*"
