name = "cf-api-switch"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 渠道配置存在 Workers KV 里。
# 如需另建（比如给预览环境单独一个）：npx wrangler kv namespace create <名字>
[[kv_namespaces]]
binding = "KV"
id = "b6de9e299dbe4455b4d7152bf1efedb4"
# preview_id = "可选，预览环境用的 namespace id"

[observability]
enabled = true

[vars]
# ---------------------------------------------------------------------------
# 无 KV 时的兜底渠道配置（JSON 数组）。配了 KV 之后以 KV 里的为准，
# 面板上的增删改会写回 KV，不会改这个变量。
# ---------------------------------------------------------------------------
CHANNELS = '[]'

# 站点设置兜底：管理员密码哈希 / 客户端 Key。
# 正常走面板设置，这里只作为无 KV 环境下的预置。
SETTINGS = '{"requireAuth": false, "clientKeys": []}'

# 上游默认超时（毫秒），渠道里可单独覆盖
UPSTREAM_TIMEOUT_MS = "120000"

# 允许跨域的来源，"*" 表示全部
CORS_ALLOW_ORIGIN = "*"
